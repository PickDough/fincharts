version: '3.8'

services:
  assets-fetcher:
    build:
      context: .
      dockerfile: Dockerfile.assets-fetcher
    environment:
      - >
        DBCONTEXT_DATABASE_URL=User ID=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Host=db;Port=5432;Database=${POSTGRES_DB};
      - FINTACHARTS_API_URL=${FINTACHARTS_API_URL}
      - FINTACHARTS_USERNAME=${FINTACHARTS_USERNAME}
      - FINTACHARTS_PASSWORD=${FINTACHARTS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 1s
      timeout: 1s
      retries: 10
volumes:
  db-data:
    driver: local
